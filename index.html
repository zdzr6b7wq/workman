<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="残業記録">
<title>残業記録</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--tx:#1d1d1f;--sub:#6e6e73;--ac:#0a7a5a;--ng:#b3541e;--bd:#e0e0e5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--card:#1c1c1e;--tx:#f2f2f7;--sub:#98989f;--ac:#34c79a;--ng:#f08a4b;--bd:#333}}
:root[data-theme="dark"]{--bg:#111;--card:#1c1c1e;--tx:#f2f2f7;--sub:#98989f;--ac:#34c79a;--ng:#f08a4b;--bd:#333}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,"Hiragino Sans",sans-serif}
main{max-width:480px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:14px;color:var(--sub);margin:0 0 8px;font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.big{font-size:20px;font-weight:700;padding:18px 0;border:0;border-radius:14px;color:#fff;background:var(--ac)}
.big.end{background:#3a5bd9}
.big:active{opacity:.7}
input,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;max-width:100%}
input[type=number]{width:80px}
button.s{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 12px}
.sum{font-size:32px;font-weight:700}
.sub{color:var(--sub);font-size:13px}
.ot{font-weight:700;font-variant-numeric:tabular-nums}
.pos{color:var(--ng)}.neg{color:var(--sub)}
.list{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:7px 4px;border-bottom:1px solid var(--bd);text-align:right;font-size:14px}
td:first-child,th:first-child{text-align:left}
tr.me td{background:var(--bg)}
textarea{width:100%;height:90px}
</style></head><body><main>

<div class="card">
  <h2>記録する日</h2>
  <input type="date" id="sel">
  <div class="btns">
    <button class="big" id="bOut">帰社</button>
    <button class="big end" id="bEnd">退勤</button>
  </div>
  <div class="row">帰社 <input type="time" id="tOut"> 退勤 <input type="time" id="tEnd"></div>
  <p class="sub" id="dayRes" style="margin:10px 0 0"></p>
</div>

<div class="card">
  <div class="row" style="justify-content:space-between">
    <button class="s" id="prev">‹</button><b id="ym"></b><button class="s" id="next">›</button>
  </div>
  <div class="sub" id="rg" style="text-align:center"></div>
  <div class="sum" id="tot">0:00</div>
  <div class="sub">残業合計（残業が出た日のみ合算）</div>
  <div class="list"><table><thead><tr><th>日</th><th>帰社</th><th>退勤</th><th>起点</th><th>残業</th></tr></thead><tbody id="rows"></tbody></table></div>
</div>

<div class="card">
  <h2>設定</h2>
  <div class="row">定時の終業時刻 <input type="time" id="sFin"></div>
  <p class="sub">残業の起点 = 帰社時刻が定時終業以降なら帰社時刻、それ以外（帰社が定時前、または未記録）なら定時終業時刻。残業 = 退勤 − 起点（0未満は0）。退勤だけ記録すれば計算されます。</p>
</div>

<div class="card">
  <h2>書き出し（表示中の期間）</h2>
  <div class="row">
    <button class="s" id="bDl">CSVを保存</button>
    <button class="s" id="bCsv">CSVをコピー</button>
    <button class="s" id="bTsv">表貼り付け用コピー</button>
  </div>
  <textarea id="ex" readonly style="margin-top:8px" placeholder="書き出し内容がここに表示されます"></textarea>
  <p class="sub" id="exMsg">形式: 日付,帰社時刻,退勤時刻,残業時間（Excel・Numbersで開けます）。「表貼り付け用」は、セルに直接貼り付けるとき用です。</p>
</div>

<div class="card">
  <h2>バックアップ</h2>
  <textarea id="bk" placeholder="ここにバックアップが表示されます"></textarea>
  <div class="row" style="margin-top:8px">
    <button class="s" id="bShow">表示</button>
    <button class="s" id="bCopy">コピー</button>
    <button class="s" id="bRest">貼り付けて復元</button>
  </div>
  <p class="sub">データはこの端末のSafari内にだけ保存されます。ときどきコピーして、メモなどに保管してください。</p>
</div>
</main>
<script>
var K='zangyo-v1';
var D={s:{fin:1065},d:{}};
try{var r=localStorage.getItem(K);if(r){var p=JSON.parse(r);D.s=Object.assign(D.s,p.s||{});D.d=p.d||{}}}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}}
function $(i){return document.getElementById(i)}
function pad(n){return String(n).padStart(2,'0')}
function key(t){return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate())}
function nowHM(){var t=new Date();return pad(t.getHours())+':'+pad(t.getMinutes())}
function tm(s){var a=s.split(':');return +a[0]*60+ +a[1]}
function hm(m){return Math.floor(m/60)+':'+pad(m%60)}
function sg(m){return (m<0?'−':'+')+hm(Math.abs(m))}
function calc(e){
  if(!e||!e.end)return null;
  var s=D.s.fin;
  if(e.out&&tm(e.out)>s)s=tm(e.out);
  return {s:s,ot:Math.max(0,tm(e.end)-s)};
}
var sel=key(new Date());
function closeOf(t){return new Date(t.getFullYear(),t.getMonth()+(t.getDate()>20?1:0),1)}
var vm=closeOf(new Date());
function range(){var y=vm.getFullYear(),m=vm.getMonth();return [key(new Date(y,m-1,21)),key(new Date(y,m,20))]}
function pk(){var r=range();return Object.keys(D.d).filter(function(k){return k>=r[0]&&k<=r[1]}).sort()}

function render(){
  $('sel').value=sel;
  var e=D.d[sel]||{};
  $('tOut').value=e.out||'';$('tEnd').value=e.end||'';
  var c=calc(e);
  $('dayRes').textContent=c?('残業の起点 '+hm(c.s)+' / 残業 '+sg(c.ot)):'退勤を記録すると計算されます';
  var r=range(),ks=pk().reverse();
  $('ym').textContent=vm.getFullYear()+'年'+(vm.getMonth()+1)+'月20日締め';
  $('rg').textContent=r[0].slice(5).replace('-','/')+' 〜 '+r[1].slice(5).replace('-','/');
  var tot=0,h='';
  ks.forEach(function(k){
    var x=D.d[k],cc=calc(x);
    if(cc&&cc.ot>0)tot+=cc.ot;
    h+='<tr data-k="'+k+'"'+(k===sel?' class="me"':'')+'><td>'+(+k.slice(5,7))+'/'+(+k.slice(8))+'</td><td>'+(x.out||'–')+'</td><td>'+(x.end||'–')+'</td><td>'+(cc?hm(cc.s):'–')+'</td><td class="ot '+(cc&&cc.ot>0?'pos':'neg')+'">'+(cc?sg(cc.ot):'–')+'</td></tr>';
  });
  $('rows').innerHTML=h||'<tr><td colspan="5" class="sub">記録がありません</td></tr>';
  $('tot').textContent=hm(tot);
  $('sFin').value=pad(Math.floor(D.s.fin/60))+':'+pad(D.s.fin%60);
}
function setF(f,v){
  var e=D.d[sel]||{};
  if(v)e[f]=v;else delete e[f];
  if(e.out||e.end)D.d[sel]=e;else delete D.d[sel];
  save();render();
}
$('bOut').onclick=function(){setF('out',nowHM())};
$('bEnd').onclick=function(){setF('end',nowHM())};
$('tOut').onchange=function(){setF('out',this.value)};
$('tEnd').onchange=function(){setF('end',this.value)};
$('sel').onchange=function(){if(this.value){sel=this.value;vm=closeOf(new Date(sel+'T00:00:00'));render()}};
$('prev').onclick=function(){vm.setMonth(vm.getMonth()-1);render()};
$('next').onclick=function(){vm.setMonth(vm.getMonth()+1);render()};
$('rows').onclick=function(ev){var tr=ev.target.closest('tr');if(tr&&tr.dataset.k){sel=tr.dataset.k;render();window.scrollTo(0,0)}};
$('sFin').onchange=function(){if(this.value){D.s.fin=tm(this.value);save();render()}};
$('bShow').onclick=function(){$('bk').value=JSON.stringify(D)};
$('bCopy').onclick=function(){
  $('bk').value=JSON.stringify(D);$('bk').select();
  try{navigator.clipboard.writeText($('bk').value)}catch(e){}
};
$('bRest').onclick=function(){
  try{
    var p=JSON.parse($('bk').value);
    if(!p||typeof p.d!=='object'||typeof p.s!=='object')throw 0;
    D={s:Object.assign(D.s,p.s),d:p.d};save();render();$('bk').value='復元しました';
  }catch(e){$('bk').value='形式が正しくありません。バックアップ文字列を貼り付けてから押してください。'}
};
function csv(sep){
  var L=[['日付','帰社時刻','退勤時刻','残業時間'].join(sep)];
  pk().forEach(function(k){var x=D.d[k],c=calc(x);L.push([k,x.out||'',x.end||'',c?hm(c.ot):''].join(sep))});
  return L.join('\r\n');
}
function msg(t){$('exMsg').textContent=t}
function cp(t){
  $('ex').value=t;$('ex').select();
  try{navigator.clipboard.writeText(t).then(function(){msg('コピーしました')},function(){msg('コピーできない場合は、上の欄を長押ししてコピーしてください')})}catch(e){msg('コピーできない場合は、上の欄を長押ししてコピーしてください')}
}
$('bCsv').onclick=function(){cp(csv(','))};
$('bTsv').onclick=function(){cp(csv('\t'))};
$('bDl').onclick=async function(){
  var t=csv(',');$('ex').value=t;
  try{
    var dl=window.claude&&await window.claude.use('downloads');
    if(!dl){msg('この画面では保存できません。「CSVをコピー」を使ってください');return}
    var y=vm.getFullYear(),m=vm.getMonth()+1;
    await dl.save({filename:'zangyo_'+y+'-'+pad(m)+'-20.csv',data:'\uFEFF'+t});
    msg('保存しました');
  }catch(e){msg(e&&e.code==='declined'?'キャンセルしました':'保存できませんでした。「CSVをコピー」を使ってください')}
};
render();
</script></body></html>
